name: CI

on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Enable unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Set up reflink-capable lab storage
        run: |
          mkdir -p "$GITHUB_WORKSPACE"
          if ! command -v mkfs.btrfs >/dev/null 2>&1 || ! command -v fsverity >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y btrfs-progs fsverity
          fi
          sudo truncate -s 10G /mnt/dylos-btrfs.img
          sudo mkfs.btrfs -f /mnt/dylos-btrfs.img
          sudo mount -o loop,compress=zstd:3 /mnt/dylos-btrfs.img "$GITHUB_WORKSPACE"
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

          # Verify reflink support on the mounted workspace
          TMP_SRC=$(mktemp "$GITHUB_WORKSPACE/reflink_test_src.XXXXXX")
          TMP_DST=$(mktemp "$GITHUB_WORKSPACE/reflink_test_dst.XXXXXX")
          rm -f "$TMP_DST"
          cp --reflink=always "$TMP_SRC" "$TMP_DST"
          rm -f "$TMP_SRC" "$TMP_DST"

          # Prove the runner supports verity reads, reflink sources and shared mappings.
          VERITY_SRC=$(mktemp "$GITHUB_WORKSPACE/verity.XXXXXX")
          printf 'verity probe\n' > "$VERITY_SRC"
          fsverity enable "$VERITY_SRC"
          fsverity measure "$VERITY_SRC"
          cp --reflink=always "$VERITY_SRC" "$VERITY_SRC.clone"
          cmp "$VERITY_SRC" "$VERITY_SRC.clone"
          python3 -c 'import mmap,sys; f=open(sys.argv[1], "rb"); m=mmap.mmap(f.fileno(), 0, access=mmap.ACCESS_COPY); assert m[:] == b"verity probe\n"' "$VERITY_SRC"
          rm -f "$VERITY_SRC" "$VERITY_SRC.clone"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup show

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just@1.58.0,cargo-nextest@0.9.146,cargo-deny@0.20.2,zizmor@1.30.1,cargo-machete@0.9.2,typos@1.51.1
          fallback: none

      - name: Install actionlint
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      - name: Run checks
        run: |
          set -o pipefail
          env "NEXTEST_SUCCESS_OUTPUT=immediate" "NEXTEST_FAILURE_OUTPUT=immediate" just check 2>&1 | tee check.log
          if grep -q "SKIPPED" check.log; then
            echo "::error::A test was skipped for missing prerequisites" >&2
            exit 1
          fi

  fuzz-check:
    name: Fuzz check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just@1.58.0,cargo-deny@0.20.2
          fallback: none

      - name: Install fuzz tools
        working-directory: fuzz
        run: |
          rustup toolchain install nightly-2026-10-13 --profile minimal
          cargo install --locked cargo-fuzz --version 0.13.2

      - name: Build fuzz harnesses
        run: just fuzz-check
