# Routed sources require an explicit peer-filtering opt-out.
peer_filtering: false
segments:
  - name: lan
    ipv6: fd64:796c:6f73:1::/64
    ipv4: 10.0.1.0/24
nodes:
  - name: vm1
    image: alpine-3-18
    vcpus: 1
    memory: 128
    interfaces:
      - name: eth0
        segment: lan
        ipv6: fd64:796c:6f73:1::2/64
        ipv4: 10.0.1.2/24
    static_routes: []
