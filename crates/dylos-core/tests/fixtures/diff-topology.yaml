# Routed sources require an explicit peer-filtering opt-out.
peer_filtering: false
segments:
  - name: seg1
    ipv6: 2001:db8:1::/64
    ipv4: 10.0.1.0/24
  - name: seg2
    ipv6: 2001:db8:2::/64
    ipv4: null
nodes:
  - name: vm1
    image: alpine-3-18
    vcpus: 2
    memory: 256
    interfaces:
      - name: eth0
        segment: seg1
        ipv6: 2001:db8:1::2/64
        ipv4: 10.0.1.2/24
    static_routes: []
