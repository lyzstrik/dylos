[workspace]
resolver = "3"
members = [
    "crates/dylos-agent",
    "crates/dylos-cli",
    "crates/dylos-core",
    "crates/dylos-fc",
    "crates/dylos-net",
    "crates/dylos-runtime",
    "crates/dylos-store",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
