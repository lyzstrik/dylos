[workspace]
resolver = "3"
exclude = ["fuzz"]
members = [
    "crates/dylos-agent",
    "crates/dylos-cli",
    "crates/dylos-core",
    "crates/dylos-fc",
    "crates/dylos-net",
    "crates/dylos-runtime",
    "crates/dylos-store",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["client", "client-legacy", "tokio"] }
ipnet = "2.12.2"
libc = "0.2.191"
nix = { version = "0.31.3", default-features = false, features = ["time"] }
proptest = "1.12.0"
rtnetlink = "0.23.0"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.1.0"
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "rt", "macros", "io-util"] }
tokio-vsock = "0.7.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry"] }
