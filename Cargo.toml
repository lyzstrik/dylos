[workspace]
resolver = "3"
members = [
    "crates/dylos-agent",
    "crates/dylos-cli",
    "crates/dylos-core",
    "crates/dylos-fc",
    "crates/dylos-net",
    "crates/dylos-runtime",
    "crates/dylos-store",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
anyhow = "1.0.100"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["client", "client-legacy", "tokio"] }
ipnet = "2.9"
nix = { version = "0.31.3", default-features = false, features = ["time"] }
proptest = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = "1.3"
serde_json = "1.0"
tempfile = "3.27.0"
thiserror = "2.0"
tokio = { version = "1.53.2", features = ["net", "rt", "macros", "io-util"] }
tokio-vsock = "0.7.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry"] }
